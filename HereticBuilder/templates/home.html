<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HereticTools</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/desktop.css">
</head>
<body>
  <main class="desktop">
    <section class="shell" aria-label="HereticTools">
      <div class="app-header">
        <div class="title">HereticTools</div>
        <div class="app-header-actions">
          <div class="offline-status" data-offline-status role="status" hidden></div>
          <button class="theme-toggle" type="button" data-theme-toggle>
            <span data-theme-toggle-label>Dark</span>
          </button>
        </div>
      </div>
      <div class="panel">
        <div class="panel-content">
          <div class="launch-grid" aria-label="Primary sections">
            <button class="launcher" type="button" data-app="Codex" data-route="codex" data-href="/codex" aria-pressed="false">
              <span class="icon" aria-hidden="true">
                <img class="icon-art" src="/assets/icons/codex.png" alt="">
              </span>
              <span class="label">Codex</span>
            </button>
            <button class="launcher" type="button" data-app="Builder" data-route="builder" data-href="/builder/" aria-pressed="false">
              <span class="icon" aria-hidden="true">
                <img class="icon-art" src="/assets/icons/builder.png" alt="">
              </span>
              <span class="label">Builder</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <footer class="app-footer" aria-label="App footer">
      <a class="support-button boosty-button" href="https://boosty.to/heretic" target="_blank" rel="noopener noreferrer" aria-label="Open Heretic on Boosty">
        <span class="support-mark boosty-mark" aria-hidden="true">
          <img class="support-art boosty-art" src="/assets/icons/boosty.png" alt="">
        </span>
        Boosty
      </a>
      <form class="app-search" role="search" autocomplete="off">
        <label class="visually-hidden" for="app-search-input">Search</label>
        <input id="app-search-input" class="app-search-input" type="search" name="q" placeholder="Search" aria-label="Search" aria-expanded="false" aria-controls="app-search-results" autocomplete="off" spellcheck="false">
        <div id="app-search-results" class="app-search-results" role="list" hidden></div>
      </form>
    </footer>
  </main>

  <script src="/static/pwa.js" defer></script>
  <script src="/static/app-search.js" defer></script>
  <script src="/static/home.js" defer></script>
</body>
</html>
