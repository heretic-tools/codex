<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ document_title }}</title>
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/desktop.css">
  <link rel="stylesheet" href="/static/codex.css">
</head>
<body>
  <main class="desktop codex-page {{ page_class }}">
    <section class="shell" aria-label="{{ title }}">
      <div class="app-header {{ app_header_class }}" role="button" tabindex="0" aria-label="{{ back_label }}" title="{{ back_label }}" data-up-href="{{ back_href }}"{{ app_header_style_attr }}>
        <div class="title"><span class="app-title-text">{{ header_title }}</span></div>
        <div class="app-header-actions">
          <button class="theme-toggle" type="button" data-theme-toggle>
            <span data-theme-toggle-label>Dark</span>
          </button>
        </div>
      </div>
{{ breadcrumb_html }}

      <div class="panel">
        <div class="panel-content">
{{ content_html }}
        </div>
      </div>
    </section>

    <footer class="app-footer" aria-label="App footer">
      <a class="support-button boosty-button" href="https://boosty.to/heretic" target="_blank" rel="noopener noreferrer" aria-label="Open Heretic on Boosty">
        <span class="support-mark boosty-mark" aria-hidden="true">
          <img class="support-art boosty-art" src="/assets/icons/boosty.png" alt="">
        </span>
        Boosty
      </a>
      <form class="app-search" role="search" autocomplete="off">
        <label class="visually-hidden" for="app-search-input">Search</label>
        <input id="app-search-input" class="app-search-input" type="search" name="q" placeholder="Search" aria-label="Search" aria-expanded="false" aria-controls="app-search-results" autocomplete="off" spellcheck="false">
        <div id="app-search-results" class="app-search-results" role="list" hidden></div>
      </form>
    </footer>
  </main>

  <script src="/static/app-search.js" defer></script>
  <script src="/static/codex.js" defer></script>
</body>
</html>
