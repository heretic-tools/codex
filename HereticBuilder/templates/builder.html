<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heretic Builder</title>
  <script src="/static/theme.js?v=__BUILDER_ASSET_VERSION__"></script>
  <link rel="stylesheet" href="/static/desktop.css">
  <link rel="stylesheet" href="/static/codex.css">
  <link rel="stylesheet" href="/static/builder.css?v=__BUILDER_ASSET_VERSION__">
</head>
<body>
  <main class="desktop codex-page builder-page">
    <section class="shell builder-shell" aria-label="Heretic Builder">
      <div class="title-bar builder-title-bar">
        <div class="title">
          <span id="builder-window-title" class="window-title-text">Builder</span>
        </div>
        <div class="builder-title-actions">
          <div id="data-status" class="builder-status" role="status">Loading</div>
          <button class="theme-toggle" type="button" data-theme-toggle>
            <span data-theme-toggle-label>Dark</span>
          </button>
        </div>
      </div>

      <div class="builder-breadcrumb-row">
        <nav id="builder-breadcrumbs" class="breadcrumb-menu builder-breadcrumbs" aria-label="Breadcrumb"></nav>
      </div>

      <div class="panel builder-panel">
        <div class="panel-content builder-panel-content">
          <div id="builder-root" class="builder-root" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <footer class="taskbar" aria-label="Desktop taskbar">
      <a class="start-button boosty-button" href="https://boosty.to/heretic" target="_blank" rel="noopener noreferrer" aria-label="Open Heretic on Boosty">
        <span class="start-mark boosty-mark" aria-hidden="true">
          <img class="start-art boosty-art" src="/assets/icons/boosty.png" alt="">
        </span>
        Boosty
      </a>
    </footer>
  </main>

  <script src="/static/builder.js?v=__BUILDER_ASSET_VERSION__" type="module"></script>
</body>
</html>
