name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PRODUCTION_CODEX_REF: d4f65b755962404df3b2b3489d371e04bb199463

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Checkout production Codex source
        if: github.event.repository.name != 'builder'
        run: git worktree add ../production-codex "$PRODUCTION_CODEX_REF"

      - name: Build static Codex site
        if: github.event.repository.name != 'builder'
        run: python3 ../production-codex/HereticBuilder/tools/builder.py build --source ../production-codex --out "$GITHUB_WORKSPACE/dist" --base-path "/${{ github.event.repository.name }}" --mount-codex-at-root

      - name: Reset production service worker
        if: github.event.repository.name != 'builder'
        run: python3 HereticBuilder/tools/builder.py reset-service-worker --out dist --base-path "/${{ github.event.repository.name }}"

      - name: Build beta index
        if: github.event.repository.name != 'builder'
        run: python3 HereticBuilder/tools/builder.py build-beta-index --out dist/beta --base-path "/${{ github.event.repository.name }}/beta"

      - name: Build beta Codex site
        if: github.event.repository.name != 'builder'
        run: python3 ../production-codex/HereticBuilder/tools/builder.py build --source ../production-codex --out "$GITHUB_WORKSPACE/dist/beta/codex" --base-path "/${{ github.event.repository.name }}/beta/codex" --mount-codex-at-root

      - name: Build beta Builder site
        if: github.event.repository.name != 'builder'
        run: python3 HereticBuilder/tools/builder.py build-builder --out dist/beta/builder --base-path "/${{ github.event.repository.name }}/beta/builder"

      - name: Build standalone Builder site
        if: github.event.repository.name == 'builder'
        run: python3 HereticBuilder/tools/builder.py build-builder --out dist --base-path "/${{ github.event.repository.name }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
