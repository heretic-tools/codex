name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static Codex site
        if: github.event.repository.name != 'builder'
        run: python3 HereticBuilder/tools/builder.py build --out dist --base-path "/${{ github.event.repository.name }}" --mount-codex-at-root

      - name: Build beta index
        if: github.event.repository.name != 'builder'
        run: python3 HereticBuilder/tools/builder.py build-beta-index --out dist/beta --base-path "/${{ github.event.repository.name }}/beta"

      - name: Build beta Codex site
        if: github.event.repository.name != 'builder'
        run: python3 HereticBuilder/tools/builder.py build --out dist/beta/codex --base-path "/${{ github.event.repository.name }}/beta/codex" --mount-codex-at-root

      - name: Build beta Builder site
        if: github.event.repository.name != 'builder'
        run: python3 HereticBuilder/tools/builder.py build-builder --out dist/beta/builder --base-path "/${{ github.event.repository.name }}/beta/builder"

      - name: Build standalone Builder site
        if: github.event.repository.name == 'builder'
        run: python3 HereticBuilder/tools/builder.py build-builder --out dist --base-path "/${{ github.event.repository.name }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
